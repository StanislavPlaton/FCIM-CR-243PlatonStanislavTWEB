<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="../jpg/sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>Каталог товаров - TechnoStore</title>
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="../index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <br><a href="../index.html" class="back-link">← На главную</a>
    <h1>Каталог комплектующих</h1>
    
<div class="grid" id="catalog-grid"></div>
<script src="../js/main.js"></script>
<script>
    setTimeout(function() {
        let grid = document.getElementById('catalog-grid');
        let htmlContent = "";

        for (let i = 0; i < products.length; i++) {
            let p = products[i];
            htmlContent += `
                <div class="card">
                    <img src="${p.image}" alt="Нет изображения">
                    <h3>${p.name}</h3>
                    <span class="price">${p.price} MDL</span>
                    <br><br>
                    <button class="btn" onclick="addToCart(${p.id})">В корзину</button>
                    <a href="product.html?id=${p.id}" style="color: #ff6600; font-weight: bold; margin-left: 10px;">Детали</a>
                </div>
            `;
        }
        
        grid.innerHTML = htmlContent;
    }, 100);
</script>
    </main>
</body>
</html>
