<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="../jpg/sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Контакты</title>
    
    <link rel="stylesheet" href="../css/contacts.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="login.html" class="menu-item">Войти</a>
                <a href="../index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
                 <a href="orders.html">Мои заказы</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container">
        <h1>Наши контакты</h1>
        
        <div class="contacts-wrapper">
            <div class="info-block">
                <p>🌏 <strong>Адрес:</strong> Кишинев</p>
                <p>📞 <strong>Телефон:</strong> +373 69 000 000</p>
                <p>📧 <strong>Email:</strong> sales@technostore.md</p>
                
                <div class="map-placeholder">
                    <p style="opacity: 0.5;">Здесь могла бы быть карта</p>
                </div>
            </div>

            <div class="form-block">
                <h3>Напишите нам</h3>
                <form action="../index.html">
                    <input type="text" placeholder="Ваше имя" required>
                    <input type="email" placeholder="Email" required>
                    <textarea placeholder="Сообщение" rows="5" required></textarea>
                    <button type="submit" class="btn">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</body>
