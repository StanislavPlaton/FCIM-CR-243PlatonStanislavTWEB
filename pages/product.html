<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TechnoStore - Информация о товаре</title>
    <link rel="icon" href="../jpg/sait2.jpg" type="image/jpg">
    <link rel="stylesheet" href="../css/product.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="../index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <br><a href="catalog.html" class="back-link">← Вернуться в каталог</a>

        <div id="product-content">
            <div class="loader">Загрузка данных о товаре...</div>
        </div>
    </main>

    <script src="../js/main.js"></script>
    
    <script>
        window.onload = function() {
            updateCounter();
            let params = new URLSearchParams(window.location.search);
            let currentId = params.get('id');

            let container = document.getElementById('product-content');
            let foundProduct = null;
            if (currentId != null) {
                for (let i = 0; i < products.length; i++) {
                    if (products[i].id == currentId) {
                        foundProduct = products[i];
                        break;
                    }
                }
            }
            if (foundProduct != null) {
                let html = `
                    <div class="product-wrapper">
                        
                        <div class="image-section">
                            <img src="${foundProduct.image}" alt="Фото товара">
                        </div>
                        
                        <div class="info-section">
                            <h1>${foundProduct.name}</h1>
                            <div class="price-tag">${foundProduct.price} MDL</div>
                            
                            <div class="specs-block">
                                <h3>Характеристики:</h3>
                                <p>${foundProduct.specs}</p>
                                
                            </div>

                            <div class="description-block">
                                <h3>Описание:</h3>
                                <p>${foundProduct.description}</p>
                            </div>

                            <div class="actions">
                                <button class="btn-buy" onclick="addToCart(${foundProduct.id})">
                                    Добавить в корзину
                                </button>
                                <a href="contacts.html" class="btn-contact">Задать вопрос</a>
                            </div>
                        </div>
                        
                    </div>
                `;
                container.innerHTML = html;                
            }
        };
    </script>
</body>
</html>
