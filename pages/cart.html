<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="../jpg/sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Корзина</title>
    
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="../index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container">
        <h1>Ваша корзина</h1>
        
        <div id="cart-items">
            <p style="text-align: center; padding: 50px; opacity: 0.5;">Загрузка товаров...</p>
        </div>

        <div class="cart-summary">
            <h3 id="total-price">Итого: 0 MDL</h3>
        </div>
        
        <div class="cart-actions">
            <button class="btn btn-clear" onclick="clearCart()">
                Очистить корзину
            </button>
            <a href="contacts.html" class="btn btn-order">
                Оформить заказ
            </a>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartIds = JSON.parse(localStorage.getItem('myCart')) || [];
            const container = document.getElementById('cart-items');
            const totalElement = document.getElementById('total-price');
            const countElement = document.getElementById('cart-count');
            let total = 0;

            function renderCart() {
                container.innerHTML = '';
                total = 0;

                if (cartIds.length === 0) {
                    container.innerHTML = `<p style="text-align:center; padding: 40px;">Корзина пуста. <a href="catalog.html" style="color:#ff6600">Перейти в каталог</a></p>`;
                    totalElement.innerText = "Итого: 0 MDL";
                    countElement.innerText = "0";
                    return;
                }

                cartIds.forEach((id, index) => {
                    const product = products.find(p => p.id === id);
                    if (product) {
                        total += product.price;
                        container.innerHTML += `
                            <div class="cart-item">
                                <div class="cart-item-info">
                                    <img src="${product.image}" width="60" alt="${product.name}">
                                    <b>${product.name}</b>
                                </div>
                                <div class="cart-item-actions">
                                    <span class="item-price">${product.price} MDL</span>
                                    <button class="remove-btn" onclick="removeFromCart(${index})">❌</button>
                                </div>
                            </div>`;
                    }
                });

                totalElement.innerText = "Итого: " + total.toLocaleString() + " MDL";
                countElement.innerText = cartIds.length;
            }

            window.removeFromCart = (index) => {
                cartIds.splice(index, 1);
                localStorage.setItem('myCart', JSON.stringify(cartIds));
                renderCart();
            };

            window.clearCart = () => {
                if(confirm("Вы уверены, что хотите очистить корзину?")) {
                    localStorage.removeItem('myCart');
                    location.reload();
                }
            };

            renderCart();
        });
    </script>
</body>
</html>
