<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container">
        <h1>Каталог комплектующих</h1>
<div style="margin-bottom: 20px;">
    <button class="btn" onclick="renderCatalog('all')">Все</button>
    <button class="btn" onclick="renderCatalog('laptops')">Ноутбуки</button>
    <button class="btn" onclick="renderCatalog('components')">Комплектующие</button>
    <button class="btn" onclick="renderCatalog('peripherals')">Периферия</button>
</div>
<div style="margin-bottom: 20px;">
    <label>Сортировать по: </label>
    <select id="sort-select" onchange="render(currentCategory)" style="padding: 8px; border-radius: 5px;">
        <option value="default">По умолчанию</option>
        <option value="price-asc">Сначала дешевые</option>
        <option value="price-desc">Сначала дорогие</option>
        <option value="name-asc">От А до Я</option>
    </select>
</div>

        <div class="grid" id="catalog-grid"></div>
    </div>

    <script src="main.js"></script>
    <script>
        const grid = document.getElementById('catalog-grid');

        function renderCatalog(filter) {
            grid.innerHTML = '';
            products.forEach(p => {
                if (filter === 'all' || p.category === filter) {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${p.image}">
                            <h3>${p.name}</h3>
                            <p style="color:#777; font-size:0.9rem;">${p.specs}</p>
                            <span class="price">${p.price} MDL</span>
                            <button class="btn" onclick="addToCart(${p.id})">Купить</button>
                            <br><br>
                            <a href="product.html?id=${p.id}" style="font-size:0.8rem; color:grey; text-decoration:underline;">Детали</a>
                        </div>
                    `;
                }
            });
        }
        renderCatalog('all');
    </script>
</body>
</html>
