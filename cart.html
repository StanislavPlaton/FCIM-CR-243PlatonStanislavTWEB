<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
        
    </header>

    <div class="container">
        <h1>Ваша корзина</h1>
        <div id="cart-items"></div>
        <h3 id="total-price" style="text-align: right; margin-top: 20px;"></h3>
        <button class="btn" onclick="clearCart()" style="background: #ccc; color: black;">Очистить корзину</button>
        <button class="btn" onclick="alert('Заказ оформлен!')">Оформить заказ</button>
    </div>

    <script src="main.js"></script>
<script>
    const cartIds = JSON.parse(localStorage.getItem('myCart')) || [];
    const container = document.getElementById('cart-items');
    let total = 0;

    function removeFromCart(index) {
        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        
        cart.splice(index, 1);
        
        localStorage.setItem('myCart', JSON.stringify(cart));
        
        location.reload();
    }

    function clearCart() {
        localStorage.removeItem('myCart');
        location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (cartIds.length === 0) {
            container.innerHTML = "<p style='text-align:center; padding: 20px;'>Корзина пуста. <a href='catalog.html'>В каталог</a></p>";
        } else {
            cartIds.forEach((id, index) => {
                const product = products.find(p => p.id === id);
                if (product) {
                    total += product.price;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <img src="${product.image}" width="60">
                                <b>${product.name}</b>
                            </div>
                            
                            <div style="display:flex; align-items:center; gap:20px;">
                                <span style="font-weight:bold;">${product.price} MDL</span>
                                <button class="remove-btn" onclick="removeFromCart(${index})" title="Удалить">
                                    ❌
                                </button>
                            </div>
                        </div>
                    `;
                }
            });
            document.getElementById('total-price').innerText = "Итого: " + total + " MDL";
        }
    });
</script>
</body>
</html>
