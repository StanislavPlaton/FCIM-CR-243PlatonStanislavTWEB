<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="jpg/sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Главная</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="index.html">Главная</a>
                <a href="pages/catalog.html">Каталог</a>
                <a href="pages/contacts.html">Контакты</a>
            </nav>
            <a href="pages/cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Обнови свой сетап сегодня</h1>
            <br>
            <a href="pages/catalog.html" class="btn-hero">Перейти в каталог</a>
        </div>
        
        <h2>Новинки</h2>
        
        <div class="grid" id="glav">
            </div>
    </div>

    <script src="js/main.js"></script>

    <script>
        window.onload = function() {
            updateCounter();

            let grid = document.getElementById('glav');
            let htmlContent = "";
            for (let i = 0; i < 3; i++) {
                let p = products[i];
                
                htmlContent += `
                    <div class="card">
                        <img src="${p.image}" alt="img">
                        <h3>${p.name}</h3>
                        <span class="price">${p.price} MDL</span>
                        <br><br>
                        <button class="btn" onclick="addToCart(${p.id})">В корзину</button>
                        <a href="pages/product.html?id=${p.id}" style="color: #ff6600; font-weight: bold; margin-left: 10px;">Детали</a>
                    </div>
                `;
            }
            grid.innerHTML = htmlContent;
        };
    </script>
</body>
</html>
