<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container">
        <div style="background: #333; color: white; padding: 60px; border-radius: 15px; margin-top: 20px; text-align: center;">
            <h1>Обнови свой сетап сегодня</h1>
            <br>
            <a href="catalog.html" class="btn">Перейти в каталог</a>
        </div>
        
        <h2>Новинки</h2>
        <div class="grid" id="new-items"></div>
    </div>

    <script src="main.js"></script>
    <script>
        const container = document.getElementById('new-items');
        products.slice(0, 3).forEach(p => {
            container.innerHTML += `
                <div class="card">
                    <img src="${p.image}">
                    <h3>${p.name}</h3>
                    <span class="price">${p.price} MDL</span>
                    <a href="product.html?id=${p.id}" class="btn">Подробнее</a>
                </div>
            `;
        });
    </script>
</body>
</html>
