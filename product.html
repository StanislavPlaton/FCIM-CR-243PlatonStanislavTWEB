<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="sait2.jpg" type="image/jpg">
    <meta charset="UTF-8">
    <title>TechnoStore - Товар</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">TechnoStore</a>
            <nav class="menu">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <div class="container" id="product-container">
        </div>

    <script src="main.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));

        const product = products.find(p => p.id === id);

        const container = document.getElementById('product-container');
        if (product) {
            container.innerHTML = `
                <div class="product-detail">
                    <img src="${product.image}" width="400">
                    <div class="product-info">
                        <h1>${product.name}</h1>
                        <span class="price" style="font-size: 2rem;">${product.price} MDL</span>
                        <div class="specs-box">
                            <strong>Характеристики:</strong><br>
                            ${product.specs}
                        </div>
                        <p>${product.description}</p>
                        <button class="btn" onclick="addToCart(${product.id})">Добавить в корзину</button>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = "<h2>Товар не найден :(</h2>";
        }
    </script>
</body>
</html>
